changelog:
    exclude:
        labels:
            - "ignore-for-release"
            - "skip-changelog"
    categories:
        - title: "Breaking Changes"
          labels:
              - "breaking"
              - "semver-major"
        - title: "Features"
          labels:
              - "enhancement"
              - "feature"
        - title: "Bug Fixes"
          labels:
              - "bug"
              - "fix"
        - title: "Maintenance"
          labels:
              - "ci"
              - "dependencies"
              - "documentation"
              - "maintenance"
        - title: "Other Changes"
          labels:
              - "*"
