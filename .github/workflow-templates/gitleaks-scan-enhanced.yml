name: "Gitleaks Secret Scan"

on:
    pull_request:
    merge_group:
        types:
            - "checks_requested"
    push:
    schedule:
        - cron: "12 4 * * *"
    workflow_dispatch:

concurrency:
    group: "gitleaks-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    scan:
        name: "Gitleaks Secret Scan"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version: "24"

            - name: "Install shared Gitleaks config"
              shell: "bash"
              run: |
                  set -euo pipefail

                  shared_config_path="node_modules/gitleaks-config-nick2bad4u/gitleaks.toml"

                  if ! grep -Fq "${shared_config_path}" .gitleaks.toml; then
                    echo "No shared npm Gitleaks config reference found in .gitleaks.toml."
                    exit 0
                  fi

                  if [[ ! -f package.json ]]; then
                    echo "::error title=Missing npm manifest::.gitleaks.toml extends ${shared_config_path}, but package.json was not found."
                    exit 1
                  fi

                  if [[ ! -f package-lock.json ]]; then
                    echo "::error title=Missing npm lockfile::.gitleaks.toml extends ${shared_config_path}, but package-lock.json was not found."
                    exit 1
                  fi

                  mapfile -t locked_metadata < <(
                    node <<'NODE'
                  const fs = require("node:fs");

                  const packageName = "gitleaks-config-nick2bad4u";
                  const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
                  const entry =
                    lock.packages?.[`node_modules/${packageName}`] ??
                    lock.dependencies?.[packageName];

                  if (!entry?.version || !entry?.integrity) {
                    console.error(
                      `package-lock.json does not contain a locked ${packageName} version and integrity.`,
                    );
                    process.exit(1);
                  }

                  console.log(entry.version);
                  console.log(entry.integrity);
                  NODE
                  )

                  locked_version="${locked_metadata[0]:-}"
                  locked_integrity="${locked_metadata[1]:-}"
                  package_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-config.XXXXXX")"
                  pack_output="${package_dir}/pack.json"

                  npm pack \
                    --ignore-scripts \
                    --json \
                    --pack-destination "${package_dir}" \
                    "gitleaks-config-nick2bad4u@${locked_version}" >"${pack_output}"

                  tarball_filename="$(
                    PACK_OUTPUT="${pack_output}" \
                    LOCKED_INTEGRITY="${locked_integrity}" \
                    node <<'NODE'
                  const fs = require("node:fs");

                  const packResults = JSON.parse(
                    fs.readFileSync(process.env.PACK_OUTPUT, "utf8"),
                  );
                  const packResult = Array.isArray(packResults)
                    ? packResults[0]
                    : packResults["gitleaks-config-nick2bad4u"];

                  if (!packResult?.filename || !packResult?.integrity) {
                    console.error("npm pack did not return package metadata.");
                    process.exit(1);
                  }

                  if (packResult.integrity !== process.env.LOCKED_INTEGRITY) {
                    console.error(
                      `Packed Gitleaks config integrity ${packResult.integrity} does not match package-lock.json ${process.env.LOCKED_INTEGRITY}.`,
                    );
                    process.exit(1);
                  }

                  process.stdout.write(packResult.filename);
                  NODE
                  )"

                  shared_config_dir="$(dirname "${shared_config_path}")"
                  mkdir -p "${shared_config_dir}"
                  tar \
                    --extract \
                    --file "${package_dir}/${tarball_filename}" \
                    --gzip \
                    --directory "${shared_config_dir}" \
                    --strip-components 1

                  if [[ ! -f "${shared_config_path}" ]]; then
                    echo "::error title=Missing shared Gitleaks config::Expected ${shared_config_path} after installing npm dependencies."
                    exit 1
                  fi

            - name: "Run Gitleaks scan"
              uses: "gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e" # v3.0.0
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  GITLEAKS_CONFIG: ".gitleaks.toml"
