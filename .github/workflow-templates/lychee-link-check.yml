# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Lychee Link Check"

run-name: "${{ github.workflow }} (${{ github.ref_name || github.run_id }})"

on:
    push:
        branches:
            - "$default-branch"
    pull_request:
        branches:
            - "$default-branch"
    merge_group:
        branches:
            - "$default-branch"
        types:
            - "checks_requested"
    workflow_dispatch:

concurrency:
    group: "lychee-link-check-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    lychee:
        name: "Lychee Link Check"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        env:
            LYCHEE_CACHE_PATH: ".lycheecache"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install dependencies"
              run: "npm ci --no-audit --no-fund"

            - name: "Set Lychee cache key"
              id: "lychee-cache-key"
              env:
                  CACHE_DEPENDENCY_HASH: "${{ hashFiles('package-lock.json') }}"
              run: |
                  set -euo pipefail

                  week="$(date -u +'%G-W%V')"
                  dependency_hash="${CACHE_DEPENDENCY_HASH:-no-dependency-hash}"

                  {
                    echo "dependency_hash=${dependency_hash}"
                    echo "week=${week}"
                  } >> "${GITHUB_OUTPUT}"

            - name: "Restore Lychee cache"
              uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25" # v5
              with:
                  path: ".lycheecache"
                  key: "lychee-${{ runner.os }}-${{ steps.lychee-cache-key.outputs.dependency_hash }}-${{ steps.lychee-cache-key.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}"
                  restore-keys: |
                      lychee-${{ runner.os }}-${{ steps.lychee-cache-key.outputs.dependency_hash }}-${{ steps.lychee-cache-key.outputs.week }}-
                      lychee-${{ runner.os }}-${{ steps.lychee-cache-key.outputs.dependency_hash }}-

            - name: "Verify Lychee config"
              env:
                  CONFIG_PATH: "node_modules/lychee-config-nick2bad4u/lychee.toml"
              run: |
                  set -euo pipefail

                  if [ ! -f "${CONFIG_PATH}" ]; then
                    echo "Lychee config was not found at ${CONFIG_PATH}." >&2
                    echo "Install lychee-config-nick2bad4u before running this workflow." >&2
                    exit 1
                  fi

            - name: "Run Lychee"
              uses: "lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411" # v2
              with:
                  args: "--config node_modules/lychee-config-nick2bad4u/lychee.toml ."
                  fail: "true"
                  failIfEmpty: "false"
                  lycheeVersion: "v0.24.2"

            - name: "Check Lychee cache path"
              id: "lychee-cache-path"
              if: "${{ !cancelled() }}"
              run: |
                  set -euo pipefail

                  if [ -e "${LYCHEE_CACHE_PATH}" ]; then
                    echo "exists=true" >> "${GITHUB_OUTPUT}"
                  else
                    echo "exists=false" >> "${GITHUB_OUTPUT}"
                  fi

            - name: "Save Lychee cache"
              if: "${{ !cancelled() && steps.lychee-cache-path.outputs.exists == 'true' }}"
              uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25" # v5
              with:
                  path: ".lycheecache"
                  key: "lychee-${{ runner.os }}-${{ steps.lychee-cache-key.outputs.dependency_hash }}-${{ steps.lychee-cache-key.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}"
