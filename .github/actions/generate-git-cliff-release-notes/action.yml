# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: "Generate git-cliff Release Notes"
description: "Generate release notes with a configurable command and fallback text."

inputs:
    expected-tag:
        description: "Release tag that must exist at the current HEAD."
        required: true
    output-path:
        description: "Release notes output path."
        required: false
        default: "temp/release-notes.md"
    command:
        description: "Shell command that writes release notes to RELEASE_NOTES_PATH."
        required: false
        default: >-
            npm run --silent changelog:release-notes -- --output "${RELEASE_NOTES_PATH}"
    fallback-text:
        description: "Text written when the command creates an empty file."
        required: false
        default: "No release notes were generated by git-cliff."
    working-directory:
        description: "Directory where the release notes command runs."
        required: false
        default: "."

outputs:
    path:
        description: "Release notes path."
        value: "${{ steps.notes.outputs.path }}"

runs:
    using: "composite"
    steps:
        - name: "Generate release notes"
          id: "notes"
          shell: "bash"
          env:
              EXPECTED_TAG: "${{ inputs.expected-tag }}"
              FALLBACK_TEXT: "${{ inputs.fallback-text }}"
              GITHUB_TOKEN: "${{ github.token }}"
              RELEASE_NOTES_COMMAND: "${{ inputs.command }}"
              RELEASE_NOTES_PATH: "${{ inputs.output-path }}"
              WORKING_DIRECTORY: "${{ inputs.working-directory }}"
          run: |
              set -euo pipefail

              cd "${WORKING_DIRECTORY}"

              if [ -z "$EXPECTED_TAG" ]; then
                echo "::error::The caller did not provide the expected release tag."
                exit 1
              fi

              tag_ref="refs/tags/${EXPECTED_TAG}"
              if ! git show-ref --verify --quiet "$tag_ref"; then
                echo "::error::Expected local tag ${EXPECTED_TAG} does not exist."
                exit 1
              fi

              tag_commit=$(git rev-parse "${tag_ref}^{commit}")
              head_commit=$(git rev-parse HEAD)
              if [ "$tag_commit" != "$head_commit" ]; then
                echo "::error::Tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                exit 1
              fi

              head_tags=$(git tag --points-at HEAD --sort=refname)
              if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                displayed_head_tags=${head_tags//$'\n'/, }
                if [ -z "$displayed_head_tags" ]; then
                  displayed_head_tags="(none)"
                fi
                echo "::error::Expected ${EXPECTED_TAG} to be the only tag at HEAD, but found: ${displayed_head_tags}."
                exit 1
              fi

              mkdir -p "$(dirname "${RELEASE_NOTES_PATH}")"
              bash -o pipefail -euc "${RELEASE_NOTES_COMMAND}"

              if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                printf '%s\n' "${FALLBACK_TEXT}" > "${RELEASE_NOTES_PATH}"
              fi

              echo "path=${RELEASE_NOTES_PATH}" >> "${GITHUB_OUTPUT}"
