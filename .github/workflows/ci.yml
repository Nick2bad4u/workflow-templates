name: "Continuous Integration"

run-name: >-
    Continuous Integration • ${{ github.event_name }} • ${{ github.event.pull_request.number || github.ref_name || github.sha }}

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    validate:
        name: "Validate repository"
        runs-on: "ubuntu-latest"
        timeout-minutes: 15
        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Install gh-action-readme"
              run: "gh extension install reakaleek/gh-action-readme --pin v0.7.1"
              env:
                  GH_TOKEN: "${{ github.token }}"

            - name: "Check composite action README drift"
              run: "npm run docs:actions:check"

            - name: "Check generated schema is up to date"
              run: "npm run schema:check:workflow-template-properties"
              env:
                  GITHUB_TOKEN: "${{ github.token }}"

            - name: "Validate schema fixtures"
              run: "npm run schema:test:workflow-template-properties"

            - name: "Validate git-cliff token exports"
              run: "npm run validate:git-cliff-token"

            - name: "Lint repository"
              run: "npm run lint"

            - name: "Lint workflow syntax with actionlint"
              uses: "reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e" # v1.73.0
              with:
                  fail_level: "error"

            - name: "Verify workflow template metadata files"
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  for workflow in .github/workflow-templates/*.yml; do
                    base="${workflow%.yml}"
                    props="${base}.properties.json"
                    if [ ! -f "$props" ]; then
                      echo "Missing template metadata file: $props" >&2
                      exit 1
                    fi
                  done
