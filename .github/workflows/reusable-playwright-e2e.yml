# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Playwright End To End Tests"

on:
    workflow_call:
        inputs:
            node_version_file:
                default: ".node-version"
                description: "Node version file used by actions/setup-node."
                required: false
                type: "string"
            cache_dependency_path:
                default: "package-lock.json"
                description: "Dependency lockfile path used for npm cache keys."
                required: false
                type: "string"

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    playwright:
        name: "Playwright Tests"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version-file: "${{ inputs.node_version_file }}"
                  cache: "npm"
                  cache-dependency-path: "${{ inputs.cache_dependency_path }}"

            - name: "Install dependencies"
              run: "npm ci --no-audit --no-fund"

            - name: "Build"
              run: "npm run build --if-present"

            - name: "Install Playwright browsers"
              run: "npx playwright install --with-deps"

            - name: "Run Playwright tests"
              run: "npx playwright test"

            - name: "Upload Playwright report"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "playwright-report"
                  path: "playwright-report/"
                  retention-days: 7
                  if-no-files-found: "ignore"
