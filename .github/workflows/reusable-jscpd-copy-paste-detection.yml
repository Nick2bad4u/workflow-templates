# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "JSCPD Copy/Paste Detection"

on:
    workflow_call:
        inputs:
            node-version:
                description: "Node.js version used to install JSCPD and the shared config package."
                required: false
                type: "string"
                default: "24"
            cache-dependency-path:
                description: "Dependency lockfile path used by npm cache."
                required: false
                type: "string"
                default: "package-lock.json"
            install-command:
                description: "Command used to install dependencies before running JSCPD."
                required: false
                type: "string"
                default: "npm ci --no-audit --no-fund"
            jscpd-command:
                description: "Command used to run JSCPD duplicate detection."
                required: false
                type: "string"
                default: "npm run lint:jscpd"
            jscpd-config-path:
                description: "Expected JSCPD config path."
                required: false
                type: "string"
                default: "node_modules/jscpd-config-nick2bad4u/jscpd.json"
            working-directory:
                description: "Directory where npm install and JSCPD commands run."
                required: false
                type: "string"
                default: "."

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    jscpd:
        name: "JSCPD Copy/Paste Detection"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        env:
            WORKING_DIRECTORY: "${{ inputs.working-directory }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: "${{ inputs.node-version }}"
                  cache: "npm"
                  cache-dependency-path: "${{ inputs.cache-dependency-path }}"

            - name: "Install dependencies"
              env:
                  INSTALL_COMMAND: "${{ inputs.install-command }}"
              run: |
                  set -euo pipefail

                  cd "${WORKING_DIRECTORY}"
                  bash -o pipefail -euc "${INSTALL_COMMAND}"

            - name: "Run JSCPD"
              env:
                  CONFIG_PATH: "${{ inputs.jscpd-config-path }}"
                  JSCPD_COMMAND: "${{ inputs.jscpd-command }}"
              run: |
                  set -euo pipefail

                  cd "${WORKING_DIRECTORY}"

                  if [ ! -f "${CONFIG_PATH}" ]; then
                    echo "JSCPD config was not found at ${CONFIG_PATH}." >&2
                    echo "Install jscpd-config-nick2bad4u before running this workflow." >&2
                    exit 1
                  fi

                  bash -o pipefail -euc "${JSCPD_COMMAND}"
