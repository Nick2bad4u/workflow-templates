# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Trufflehog Secret Scan"

on:
    workflow_call:
concurrency:
    group: "trufflehog-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

jobs:
    scan:
        name: "Secret Scanning"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Run Trufflehog scan"
              uses: "trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11" # v3.96.0
              with:
                  path: "."
                  base: "${{ '' }}"
                  head: "${{ github.ref_name }}"
                  # Only fail the job for VERIFIED secrets.
                  # Unverified/unknown results are often high-noise in OSS repos
                  # (example strings, docs, placeholder tokens) and already
                  # covered by other scanners (gitleaks, etc.).
                  extra_args: "--results=verified --exclude-detectors=URI"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
