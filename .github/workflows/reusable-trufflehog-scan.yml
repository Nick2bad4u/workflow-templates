# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Trufflehog Secret Scan"

on:
    workflow_call:
concurrency:
    group: "trufflehog-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

jobs:
    scan:
        name: "Secret Scanning"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Run Trufflehog scan"
              uses: "trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2" # v3.99.7
              with:
                  path: "."
                  base: "${{ '' }}"
                  head: "${{ github.ref_name }}"
                  # Only fail the job for VERIFIED secrets.
                  # Unverified/unknown results are often high-noise in OSS repos
                  # (example strings, docs, placeholder tokens) and already
                  # covered by other scanners (gitleaks, etc.).
                  extra_args: "--results=verified --exclude-detectors=URI"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
