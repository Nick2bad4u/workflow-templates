# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Trufflehog Secret Scan"

on:
    workflow_call:
concurrency:
    group: "trufflehog-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

jobs:
    scan:
        name: "Secret Scanning"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Run Trufflehog scan"
              uses: "trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85" # v3.97.9
              with:
                  path: "."
                  base: "${{ '' }}"
                  head: "${{ github.ref_name }}"
                  # Only fail the job for VERIFIED secrets.
                  # Unverified/unknown results are often high-noise in OSS repos
                  # (example strings, docs, placeholder tokens) and already
                  # covered by other scanners (gitleaks, etc.).
                  extra_args: "--results=verified --exclude-detectors=URI"
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
