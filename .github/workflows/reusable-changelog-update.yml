# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Update Changelogs"

on:
    workflow_call:
        inputs:
            cliff_config:
                default: "cliff.toml"
                description: "Path to the git-cliff config file."
                required: false
                type: "string"
            changelog_path:
                default: "CHANGELOG.md"
                description: "Path to write the generated changelog."
                required: false
                type: "string"

permissions:
    contents: "write"
    pull-requests: "write"

defaults:
    run:
        shell: "bash"

jobs:
    update-changelog:
        name: "Update Changelog"
        runs-on: "ubuntu-latest"
        timeout-minutes: 45
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version: "24"

            - name: "Generate changelog"
              env:
                  CHANGELOG_PATH: "${{ inputs.changelog_path || 'CHANGELOG.md' }}"
                  CLIFF_CONFIG: "${{ inputs.cliff_config || 'cliff.toml' }}"
                  GITHUB_TOKEN: "${{ github.token }}"
              run: |
                  npx git-cliff --config "${CLIFF_CONFIG}" --verbose --output "${CHANGELOG_PATH}"

            - name: "Create changelog pull request"
              uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8.1.1
              with:
                  commit-message: "chore: update changelog [skip ci]"
                  title: "chore: update changelog"
                  body: "Automated changelog update via GitHub Actions."
                  branch: "chore/update-changelog"
                  add-paths: "${{ inputs.changelog_path || 'CHANGELOG.md' }}"
                  delete-branch: false
                  token: "${{ secrets.GITHUB_TOKEN }}"
