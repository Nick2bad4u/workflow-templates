# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Microsoft Security DevOps"

on:
    workflow_call:

permissions:
    actions: "read"
    contents: "read"
    security-events: "write"

jobs:
    msdo:
        name: "Microsoft Security DevOps"
        runs-on: "ubuntu-latest"
        timeout-minutes: 45
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Run Microsoft Security DevOps"
              id: "msdo"
              uses: "microsoft/security-devops-action@cf28f87c67770dbaa208cce3665fafc849f77507" # v1.12.1

            - name: "Upload Microsoft Security DevOps SARIF"
              uses: "github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
              with:
                  sarif_file: "${{ steps.msdo.outputs.sarifFile }}"
