# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "OpenSSF Scorecard"

on:
    workflow_call:
concurrency:
    group: "scorecard-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions: {}

jobs:
    analysis:
        name: "Scorecard Analysis"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            contents: "read"
            security-events: "write"
            id-token: "write"
            actions: "read"
            issues: "read"
            pull-requests: "read"
            checks: "read"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Run Scorecard analysis"
              uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e" # v2.5.0
              with:
                  results_file: "scorecard-results.sarif"
                  results_format: "sarif"
                  # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
                  # - you want to enable the Branch-Protection check on a *public* repository, or
                  # - you are installing Scorecards on a *private* repository
                  # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
                  # repo_token: ${{ secrets.SCORECARD_TOKEN }}

                  # Public repositories:
                  #   - Publish results to OpenSSF REST API for easy access by consumers
                  #   - Allows the repository to include the Scorecard badge.
                  #   - See https://github.com/ossf/scorecard-action#publishing-results.
                  # For private repositories:
                  #   - `publish_results` will always be set to `false`, regardless
                  #     of the value entered here.
                  publish_results: true

            - name: "Upload Scorecard results"
              uses: "github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
              with:
                  sarif_file: "scorecard-results.sarif"

            # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
            # format to the repository Actions tab.
            - name: "Upload artifact"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "Results SARIF file"
                  path: "scorecard-results.sarif"
                  retention-days: 7
