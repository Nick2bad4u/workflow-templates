# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "First Interaction Greeting"

on:
    workflow_call:

permissions:
    contents: "read"

jobs:
    greeting:
        name: "Post First Interaction Greeting"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        permissions:
            issues: "write"
            pull-requests: "write"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "First interaction"
              uses: "actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d" # v3.1.0
              with:
                  repo_token: "${{ secrets.GITHUB_TOKEN }}"
                  issue_message: "Thanks for opening your first issue. A maintainer will review it."
                  pr_message: "Thanks for opening your first pull request. A maintainer will review it."
