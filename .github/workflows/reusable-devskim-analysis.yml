# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Dev Skim Security Analysis"

on:
    workflow_call:

permissions:
    actions: "read"
    contents: "read"
    security-events: "write"

jobs:
    devskim:
        name: "DevSkim"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Run DevSkim scanner"
              uses: "microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6" # v1.0.16
              with:
                  directory-to-scan: "."
                  should-scan-archives: false
                  output-filename: "devskim-results.sarif"
                  output-directory: "."
                  ignore-globs: "**/.git/**,**/bin/**,**/dist/**,**/node_modules/**"

            - name: "Upload DevSkim SARIF artifact"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "devskim-results"
                  path: "devskim-results.sarif"

            - name: "Upload DevSkim SARIF"
              uses: "github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
              with:
                  sarif_file: "devskim-results.sarif"
