# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "CodeQL Analysis (Manual Build)"

on:
    workflow_call:
        inputs:
            languages:
                description: "JSON array of CodeQL language identifiers that require the supplied build command."
                required: true
                type: "string"
            build-command:
                description: "Shell command that builds the repository after CodeQL initialization."
                required: true
                type: "string"
concurrency:
    group: "codeql-build-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"
    security-events: "write"

defaults:
    run:
        shell: "bash"

jobs:
    analyze:
        name: "Analyze (${{ matrix.language }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        strategy:
            fail-fast: true
            matrix:
                language: "${{ fromJSON(inputs.languages) }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1" # v2.21.1
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Initialize CodeQL"
              uses: "github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2" # v4.38.2
              with:
                  languages: "${{ matrix.language }}"
                  build-mode: "manual"

            - name: "Run build"
              env:
                  BUILD_COMMAND: "${{ inputs.build-command }}"
              run: |
                  set -euo pipefail
                  bash -euo pipefail -c "${BUILD_COMMAND}"

            - name: "Analyze"
              uses: "github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2" # v4.38.2
              with:
                  category: "/language:${{ matrix.language }}"
