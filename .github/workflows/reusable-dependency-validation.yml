# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Node Dependency Validation"

on:
    workflow_call:
        inputs:
            node_version_file:
                default: ".node-version"
                description: "Node version file used by actions/setup-node."
                required: false
                type: "string"
            cache_dependency_path:
                default: "package-lock.json"
                description: "Dependency lockfile path used for npm cache keys."
                required: false
                type: "string"

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    dependency-validation:
        name: "Validate Dependencies"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        env:
            NODE_OPTIONS: "--max_old_space_size=8192"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version-file: "${{ inputs.node_version_file }}"
                  cache: "npm"
                  cache-dependency-path: "${{ inputs.cache_dependency_path }}"

            - name: "Install dependencies"
              run: "npm ci --no-audit --no-fund"

            - name: "Run validation command"
              run: "npm run release:verify --if-present"

            - name: "Collect diagnostics"
              if: "failure()"
              run: |
                  mkdir -p artifacts/dependency-validation
                  node --version > artifacts/dependency-validation/node-version.txt
                  npm --version > artifacts/dependency-validation/npm-version.txt
                  git status --short > artifacts/dependency-validation/git-status.txt
                  npm ls --all > artifacts/dependency-validation/npm-ls.txt 2>&1 || true

            - name: "Upload dependency validation diagnostics"
              if: "failure()"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "dependency-validation-diagnostics"
                  path: "artifacts/dependency-validation/**"
                  if-no-files-found: "error"
                  include-hidden-files: true
