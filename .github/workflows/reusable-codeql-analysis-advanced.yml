# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "CodeQL Analysis (Advanced)"

on:
    workflow_call:
        inputs:
            languages:
                description: "JSON array of no-custom-build CodeQL language identifiers to analyze."
                required: false
                type: "string"
                default: >-
                    ["javascript-typescript","actions"]
concurrency:
    group: "codeql-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"
    security-events: "write"

jobs:
    analyze:
        name: "Analyze"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        strategy:
            fail-fast: true
            matrix:
                language: "${{ fromJSON(inputs.languages) }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Initialize CodeQL"
              uses: "github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
              with:
                  languages: "${{ matrix.language }}"

            - name: "Analyze"
              uses: "github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370" # v4.39.1
              with:
                  category: "/language:${{ matrix.language }}"
