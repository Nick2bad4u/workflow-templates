# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Mega Linter"

on:
    workflow_call:

permissions:
    checks: "write"
    contents: "read"
    pull-requests: "write"

jobs:
    mega-linter:
        name: "Run Mega Linter"
        runs-on: "ubuntu-latest"
        timeout-minutes: 45
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Mega Linter"
              id: "mega-linter"
              uses: "oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2" # v10.1.0
              env:
                  APPLY_FIXES: "none"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Upload Mega Linter reports"
              if: "success() || failure()"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "mega-linter-reports"
                  path: |
                      megalinter-reports
                      mega-linter.log
                  if-no-files-found: "ignore"
