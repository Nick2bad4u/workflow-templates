# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Sonar Cloud Analysis"

on:
    workflow_call:
        inputs:
            node_version_file:
                default: ".node-version"
                description: "Node version file used by actions/setup-node."
                required: false
                type: "string"
            cache_dependency_path:
                default: "package-lock.json"
                description: "Dependency lockfile path used for npm cache keys."
                required: false
                type: "string"
        secrets:
            SONAR_TOKEN:
                description: "SonarCloud token."
                required: false

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    sonarcloud:
        name: "SonarCloud Code Quality Analysis"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        env:
            SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
              with:
                  node-version-file: "${{ inputs.node_version_file }}"
                  cache: "npm"
                  cache-dependency-path: "${{ inputs.cache_dependency_path }}"

            - name: "Install dependencies"
              run: "npm ci --no-audit --no-fund"

            - name: "Build"
              run: "npm run build --if-present"

            - name: "Run coverage"
              run: "npm run test:coverage --if-present"

            - name: "Skip SonarCloud scan without token"
              if: "${{ env.SONAR_TOKEN == '' }}"
              run: "echo '::warning::SONAR_TOKEN is not available. Skipping SonarCloud scan.'"

            - name: "SonarCloud scan"
              if: "${{ env.SONAR_TOKEN != '' }}"
              uses: "SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304" # v8.4.0
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  SONAR_TOKEN: "${{ env.SONAR_TOKEN }}"
