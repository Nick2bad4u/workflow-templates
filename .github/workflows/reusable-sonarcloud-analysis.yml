# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Sonar Cloud Analysis"

on:
    workflow_call:
        inputs:
            node_version_file:
                default: ".node-version"
                description: "Node version file used by actions/setup-node."
                required: false
                type: "string"
            cache_dependency_path:
                default: "package-lock.json"
                description: "Dependency lockfile path used for npm cache keys."
                required: false
                type: "string"
        secrets:
            SONAR_TOKEN:
                description: "SonarCloud token."
                required: false

permissions:
    contents: "read"

defaults:
    run:
        shell: "bash"

jobs:
    sonarcloud:
        name: "SonarCloud Code Quality Analysis"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        env:
            SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
        steps:
            - name: "Harden runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0

            - name: "Setup Node"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: "${{ inputs.node_version_file }}"
                  cache: "npm"
                  cache-dependency-path: "${{ inputs.cache_dependency_path }}"

            - name: "Install dependencies"
              run: "npm ci --no-audit --no-fund"

            - name: "Build"
              run: "npm run build --if-present"

            - name: "Run coverage"
              run: "npm run test:coverage --if-present"

            - name: "Skip SonarCloud scan without token"
              if: "${{ env.SONAR_TOKEN == '' }}"
              run: "echo '::warning::SONAR_TOKEN is not available. Skipping SonarCloud scan.'"

            - name: "SonarCloud scan"
              if: "${{ env.SONAR_TOKEN != '' }}"
              uses: "SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f" # v8.2.1
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  SONAR_TOKEN: "${{ env.SONAR_TOKEN }}"
